<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />

    <title>Contact form</title>
  </head>
  <body>
    <main class="card">
      <h1 class="header">Contact Us</h1>
      <form action="#" class="form">
        <div>
          <label for="firstName"> First Name* </label>
          <input id="firstName" type="text" name="firstName" />
          <p id="errorFirstName" class="error">This field is required</p>
        </div>

        <div>
          <label for="lastName"> Last Name* </label>
          <input id="lastName" type="text" name="lastName" />
          <p class="errorLastName">This field is required</p>
        </div>

        <div>
          <label for="email"> Email Address* </label>
          <input id="email" type="email" name="email" />
          <p class="errorEmail">Please enter a valid email address</p>
        </div>

        <fieldset>
          <legend>Query Type *</legend>
          <label class="radio-container" for="radio1">
            <input
              id="radio1"
              type="radio"
              name="queryType"
              value="GeneralEnquiry"
              class="radio"
            />
            <div class="checkbox"></div>
            <p class="radio-label">General Enquiry</p>
          </label>

          <label class="radio-container" for="radio2">
            <input
              id="radio2"
              type="radio"
              name="queryType"
              value="SupportRequest"
              class="radio"
            />
            <div class="checkbox"></div>
            <p class="radio-label">Support Request</p>
          </label>

          <p class="errorRadio">Please select a query type</p>
        </fieldset>

        <div>
          <label for="message">Message *</label>
          <textarea
            name="message"
            id="message"
            class="textarea"
            rows="4"
          ></textarea>
          <p id="errorMessage" class="error">This field is required</p>
        </div>

        <label for="consent">
          <input
            type="checkbox"
            id="consent"
            value="false"
            class="input-checkbox"
          />
          <div class="checkbox"></div>
          <p class="checkbox-label">
            I consent to being contacted by the team *
          </p>
        </label>
        <button class="btn" type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
